
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Handyhub - Home Services</title>
<style>
body{font-family:Arial;background:#f2f5fa;margin:0;color:#172033}
header{background:#123b70;color:white;padding:25px;text-align:center}
main{max-width:500px;margin:20px auto;padding:15px}
.card{background:white;padding:20px;border-radius:14px;margin-bottom:15px}
input,select,textarea,button{width:100%;padding:13px;margin:8px 0;box-sizing:border-box;border-radius:8px;border:1px solid #ccc;font-size:16px}
button{background:#1264bd;color:white;border:0;font-weight:bold}
.call{background:#159447}
.whatsapp{background:#159447}
</style>
</head>
<body>
<header>
<h1>Handyhub</h1>
<p>Your Trusted Home Service Partner</p>
</header>
<main>
<div class="card">
<h2>Book a Service</h2>
<form id="booking">
<input id="name" placeholder="Your Name" required>
<input id="phone" placeholder="Mobile Number" type="tel" required>
<textarea id="address" placeholder="Your Address" required></textarea>
<select id="service" required>
<option value="">Select Service</option>
<option>Electrician</option>
<option>Plumber</option>
<option>AC Repair</option>
<option>Carpenter</option>
<option>Painter</option>
<option>Cleaning</option>
</select>
<button type="submit">Book Now on WhatsApp</button>
</form>
</div>
<div class="card">
<h2>Contact Us</h2>
<a href="tel:8923375907"><button class="call">Call 8923375907</button></a>
<a href="tel:8445967991"><button class="call">Call 8445967991</button></a>
<a href="https://wa.me/8445967991"><button class="whatsapp">WhatsApp Us</button></a>
</div>
</main>
<script>
document.getElementById("booking").addEventListener("submit",function(e){
e.preventDefault();
let n=document.getElementById("name").value;
let p=document.getElementById("phone").value;
let a=document.getElementById("address").value;
let s=document.getElementById("service").value;
let msg="New Handyhub Booking%0AName: "+encodeURIComponent(n)+"%0APhone: "+encodeURIComponent(p)+"%0AAddress: "+encodeURIComponent(a)+"%0AService: "+encodeURIComponent(s);
window.open("https://wa.me/8445967991?text="+msg,"_blank");
});
</script>
</body>
</html>
